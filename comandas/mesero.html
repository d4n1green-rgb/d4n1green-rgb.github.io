<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesero - Angel Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ocultar scrollbar para que se vea como una app nativa */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-xl font-bold">Angel Systems <span class="text-blue-300 text-sm">| Mesero</span></h1>
            <p class="text-xs text-blue-200">Mesa Actual: <span id="mesaActual" class="font-bold">Ninguna</span></p>
        </div>
        <!-- Botón Modo Offline -->
        <div class="flex items-center space-x-2 bg-blue-800 p-2 rounded-lg cursor-pointer" onclick="toggleOffline()">
            <span id="statusText" class="text-sm font-semibold text-green-400">🌐 Online</span>
            <div id="toggleSwitch" class="w-10 h-5 bg-green-500 rounded-full relative transition-colors">
                <div id="toggleCircle" class="w-5 h-5 bg-white rounded-full absolute left-0 transition-transform"></div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Menú de Productos -->
        <div class="w-2/3 p-4 overflow-y-auto">
            <h2 class="text-lg font-bold text-gray-700 mb-4">Seleccionar Productos</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="menuContainer">
                <!-- Los productos se inyectan con JS -->
            </div>
        </div>

        <!-- Carrito / Orden Actual -->
        <div class="w-1/3 bg-white border-l shadow-lg flex flex-col">
            <div class="p-4 bg-gray-50 border-b">
                <h2 class="text-lg font-bold text-gray-800">Orden Actual</h2>
            </div>
            <div class="flex-1 p-4 overflow-y-auto" id="cartContainer">
                <p class="text-gray-400 text-center mt-10">No hay productos en la orden</p>
            </div>
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between text-xl font-bold mb-4">
                    <span>Total:</span>
                    <span class="text-blue-700">$<span id="totalPrice">0.00</span></span>
                </div>
                <button onclick="enviarCocina()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg shadow-lg text-lg flex justify-center items-center transition transform active:scale-95">
                    ENVIAR A COCINA 🚀
                </button>
            </div>
        </div>
    </main>

    <script>
        // 1. DEFINICIÓN DE DATOS (Simulando la base de datos)
        const productos = [
            { id: 1, nombre: "Cerveza Cristal", precio: 250, emoji: "🍺" },
            { id: 2, nombre: "Pizza Muzzarella", precio: 800, emoji: "🍕" },
            { id: 3, nombre: "Café Cubano", precio: 100, emoji: "☕" },
            { id: 4, nombre: "Refresco Cola", precio: 200, emoji: "🥤" },
            { id: 5, nombre: "Hamburguesa", precio: 600, emoji: "🍔" },
            { id: 6, nombre: "Ron Havana", precio: 350, emoji: "🥃" }
        ];

        let carrito = [];
        let mesaSeleccionada = "Mesa 1"; // Simulamos que ya eligió mesa
        let isOffline = false;
        
        // Referencias al DOM
        const menuContainer = document.getElementById('menuContainer');
        const cartContainer = document.getElementById('cartContainer');
        const totalPriceEl = document.getElementById('totalPrice');
        const mesaActualEl = document.getElementById('mesaActual');

        // Canal de comunicación (Simula el WebSocket / Red Local)
        const channel = new BroadcastChannel('angel_systems_canal');

        // 2. INICIALIZACIÓN
        function init() {
            mesaActualEl.textContent = mesaSeleccionada;
            renderMenu();
            actualizarCarrito();
        }

        // 3. RENDERIZAR MENÚ
        function renderMenu() {
            menuContainer.innerHTML = '';
            productos.forEach(prod => {
                menuContainer.innerHTML += `
                    <button onclick="agregarAlCarrito(${prod.id})" class="bg-white p-4 rounded-xl shadow hover:shadow-md transition border border-gray-200 flex flex-col items-center justify-center h-32 active:bg-blue-50">
                        <span class="text-4xl mb-2">${prod.emoji}</span>
                        <span class="font-bold text-gray-800 text-sm text-center">${prod.nombre}</span>
                        <span class="text-blue-600 font-semibold mt-1">$${prod.precio}</span>
                    </button>
                `;
            });
        }

        // 4. LÓGICA DEL CARRITO
        function agregarAlCarrito(id) {
            const producto = productos.find(p => p.id === id);
            const itemEnCarrito = carrito.find(item => item.id === id);

            if (itemEnCarrito) {
                itemEnCarrito.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            actualizarCarrito();
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function actualizarCarrito() {
            cartContainer.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                cartContainer.innerHTML = '<p class="text-gray-400 text-center mt-10">No hay productos en la orden</p>';
            } else {
                carrito.forEach((item, index) => {
                    total += item.precio * item.cantidad;
                    cartContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-3 mb-2 rounded-lg border border-gray-100">
                            <div>
                                <p class="font-bold text-gray-800">${item.nombre}</p>
                                <p class="text-sm text-gray-500">${item.cantidad} x $${item.precio}</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="font-bold text-blue-700">$${item.precio * item.cantidad}</span>
                                <button onclick="eliminarDelCarrito(${index})" class="text-red-500 hover:text-red-700 font-bold">✕</button>
                            </div>
                        </div>
                    `;
                });
            }
            totalPriceEl.textContent = total.toFixed(2);
        }

        // 5. ENVIAR A COCINA Y SINCRONIZACIÓN
        function enviarCocina() {
            if (carrito.length === 0) return alert("Agrega productos primero");

            const nuevaOrden = {
                id: Date.now(), // ID único
                mesa: mesaSeleccionada,
                productos: [...carrito],
                total: parseFloat(totalPriceEl.textContent),
                estado: 'pendiente',
                hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            // Guardar en "Base de Datos" (LocalStorage)
            let ordenesGuardadas = JSON.parse(localStorage.getItem('ordenes_angel')) || [];
            ordenesGuardadas.push(nuevaOrden);
            localStorage.setItem('ordenes_angel', JSON.stringify(ordenesGuardadas));

            // Si estamos online, enviamos por el canal (BroadcastChannel)
            if (!isOffline) {
                channel.postMessage({ tipo: 'NUEVA_ORDEN', orden: nuevaOrden });
                alert("✅ Orden enviada a cocina en tiempo real.");
            } else {
                // Si estamos offline, simulamos que se guardó
                alert("📶 MODO OFFLINE: Orden guardada en el dispositivo. Se enviará cuando vuelva la conexión.");
            }

            // Limpiar carrito
            carrito = [];
            actualizarCarrito();
        }

        // 6. LÓGICA DEL MODO OFFLINE
        function toggleOffline() {
            isOffline = !isOffline;
            const statusText = document.getElementById('statusText');
            const toggleSwitch = document.getElementById('toggleSwitch');
            const toggleCircle = document.getElementById('toggleCircle');

            if (isOffline) {
                statusText.textContent = "🔴 Offline (Local)";
                statusText.classList.replace('text-green-400', 'text-red-400');
                toggleSwitch.classList.replace('bg-green-500', 'bg-red-500');
                toggleCircle.classList.replace('left-0', 'left-5');
            } else {
                statusText.textContent = "🌐 Online";
                statusText.classList.replace('text-red-400', 'text-green-400');
                toggleSwitch.classList.replace('bg-red-500', 'bg-green-500');
                toggleCircle.classList.replace('left-5', 'left-0');
                
                // Simular sincronización al volver online
                if (confirm("Conexión restablecida. ¿Sincronizar órdenes pendientes con la cocina?")) {
                    let ordenes = JSON.parse(localStorage.getItem('ordenes_angel')) || [];
                    ordenes.forEach(o => channel.postMessage({ tipo: 'NUEVA_ORDEN', orden: o }));
                    alert("Órdenes sincronizadas correctamente.");
                }
            }
        }

        // Iniciar app
        init();
    </script>
</body>
</html>
