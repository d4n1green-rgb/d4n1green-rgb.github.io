<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Cita - Barbería Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-900 p-6 text-center text-white">
            <h1 class="text-2xl font-bold">Barbería "El Estilo"</h1>
            <p class="text-blue-200 text-sm mt-1">Reserva tu turno en segundos</p>
        </div>

        <!-- Formulario -->
        <div class="p-6">
            <form id="reservaForm" onsubmit="event.preventDefault(); agendarCita();">
                
                <!-- Nombre -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tu Nombre:</label>
                    <input type="text" id="nombre" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="Ej: Juan Pérez">
                </div>

                <!-- Servicio -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Selecciona el Servicio:</label>
                    <select id="servicio" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 bg-white">
                        <option value="" disabled selected>Elige un servicio...</option>
                        <option value="Corte Clásico">Corte Clásico ($300)</option>
                        <option value="Corte + Barba">Corte + Barba ($500)</option>
                        <option value="Tinte">Tinte ($800)</option>
                        <option value="Arreglo de Ceja">Arreglo de Ceja ($150)</option>
                    </select>
                </div>

                <!-- Fecha y Hora -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Fecha:</label>
                        <input type="date" id="fecha" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Hora:</label>
                        <input type="time" id="hora" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition">
                    Confirmar Reserva ✅
                </button>
            </form>

            <!-- Mensaje de éxito -->
            <div id="successMsg" class="hidden mt-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg text-center">
                <p class="font-bold">¡Cita Agendada!</p>
                <p class="text-sm">Tu reserva ha sido enviada al negocio.</p>
                <button onclick="window.location.reload()" class="mt-2 text-xs underline text-green-800">Hacer otra reserva</button>
            </div>
        </div>
    </div>

    <script>
        // Canal para avisar al administrador en tiempo real (Simulando la red local)
        const channel = new BroadcastChannel('angel_citas_canal');

        function agendarCita() {
            const nombre = document.getElementById('nombre').value;
            const servicio = document.getElementById('servicio').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;

            const nuevaCita = {
                id: Date.now(),
                nombre,
                servicio,
                fecha,
                hora,
                estado: 'Pendiente'
            };

            // 1. Guardar en localStorage (Base de datos simulada)
            let citas = JSON.parse(localStorage.getItem('citas_angel')) || [];
            citas.push(nuevaCita);
            localStorage.setItem('citas_angel', JSON.stringify(citas));

            // 2. Enviar por el canal (Avisa al admin)
            channel.postMessage({ tipo: 'NUEVA_CITA', cita: nuevaCita });

            // 3. Ocultar formulario y mostrar éxito
            document.getElementById('reservaForm').classList.add('hidden');
            document.getElementById('successMsg').classList.remove('hidden');
        }

        // Establecer la fecha mínima como hoy
        document.getElementById('fecha').min = new Date().toISOString().split("T")[0];
    </script>
</body>
</html>
